<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Classroom Player</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background-color: #121212; color: #fff; }
    header { padding: 20px; background: #1e1e1e; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
    .container { display: flex; height: calc(100vh - 80px); }
    
    /* Sidebar Navigation */
    .sidebar { width: 300px; background: #181818; border-right: 1px solid #333; overflow-y: auto; padding: 15px; }
    .folder-group { margin-bottom: 20px; }
    .folder-title { font-size: 1.1em; color: #888; border-bottom: 1px solid #333; padding-bottom: 5px; margin-bottom: 10px; }
    .video-item { padding: 10px; background: #242424; margin-bottom: 8px; border-radius: 4px; cursor: pointer; transition: background 0.2s; }
    .video-item:hover, .video-item.active { background: #0066cc; }

    /* Main Player Stage */
    .stage { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; background: #000; }
    .player-wrapper { width: 100%; max-width: 960px; aspect-ratio: 16 / 9; background: #000; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.8); }
    iframe, video { width: 100%; height: 100%; border: none; }
    .now-playing { margin-top: 15px; font-size: 1.3em; font-weight: bold; color: #eee; }
    .empty-state { text-align: center; color: #666; }
  </style>
</head>
<body>

  <header>
    <h1>Classroom Theater</h1>
    <div id="userInfo">Logged in Teacher</div>
  </header>

  <div class="container">
    <div class="sidebar" id="sidebar">
      <p>Loading library...</p>
    </div>

    <div class="stage">
      <div class="player-wrapper" id="playerContainer">
        <div class="empty-state">
          <h2>Select a video from the sidebar to start playing.</h2>
        </div>
      </div>
      <div class="now-playing" id="nowPlayingTitle"></div>
    </div>
  </div>

  <script src="js/supabaseClient.js"></script>
  <script src="js/classroom.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Classroom Player</title>

  <!-- Supabase CDN Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; height: 100vh; overflow: hidden; }
    
    header { 
      height: 60px; 
      padding: 0 20px; 
      background: #1e1e1e; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      border-bottom: 1px solid #333; 
    }
    
    /* Strict Side-by-Side Flex Layout */
    .app-layout { 
      display: flex; 
      flex-direction: row; 
      width: 100vw; 
      height: calc(100vh - 60px); 
    }
    
    /* Dedicated Left Sidebar */
    .sidebar { 
      width: 320px; 
      min-width: 320px; 
      max-width: 320px; 
      background: #181818; 
      border-right: 1px solid #333; 
      overflow-y: auto; 
      padding: 15px; 
      height: 100%; 
    }
    
    .folder-group { margin-bottom: 20px; }
    .folder-title { font-size: 1.05em; font-weight: bold; color: #aaa; border-bottom: 1px solid #333; padding-bottom: 5px; margin-bottom: 10px; }
    
    /* Explicit Interactive Video Buttons */
    .video-btn {
      display: block;
      width: 100%;
      padding: 12px;
      margin-bottom: 8px;
      background: #282828;
      color: #fff;
      border: 1px solid #3d3d3d;
      border-radius: 6px;
      text-align: left;
      cursor: pointer;
      font-size: 0.95em;
      pointer-events: auto;
      transition: background 0.2s, border-color 0.2s;
    }
    .video-btn:hover { background: #383838; border-color: #0066cc; }
    .video-btn.active { background: #0066cc; border-color: #004080; font-weight: bold; }

    /* Main Video Stage */
    .stage { 
      flex: 1; 
      display: flex; 
      flex-direction: column; 
      justify-content: center; 
      align-items: center; 
      padding: 20px; 
      background: #000; 
      height: 100%; 
    }
    
    .player-wrapper { 
      width: 100%; 
      max-width: 960px; 
      aspect-ratio: 16 / 9; 
      background: #111; 
      border-radius: 8px; 
      overflow: hidden; 
      box-shadow: 0 4px 20px rgba(0,0,0,0.8); 
    }
    
    .now-playing { margin-top: 15px; font-size: 1.3em; font-weight: bold; color: #eee; }
    .empty-state { display: flex; height: 100%; align-items: center; justify-content: center; color: #666; text-align: center; padding: 20px; }
    .nav-btn { background: #0066cc; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; margin-left: 10px; }
  </style>
</head>
<body>

  <header>
    <h2>Classroom Theater</h2>
    <div>
      <button class="nav-btn" onclick="window.location.href='teacher.html'">Teacher Portal</button>
      <button class="nav-btn" style="background:#dc3545;" onclick="supabase.auth.signOut().then(() => window.location.href='index.html')">Log Out</button>
    </div>
  </header>

  <div class="app-layout">
    <!-- Left Sidebar -->
    <div class="sidebar" id="sidebar">
      <p style="color: #aaa;">Loading video library...</p>
    </div>

    <!-- Right Video Player Stage -->
    <div class="stage">
      <div class="player-wrapper" id="playerContainer">
        <div class="empty-state">
          <h3>Select a video from the left sidebar to start playing.</h3>
        </div>
      </div>
      <div class="now-playing" id="nowPlayingTitle"></div>
    </div>
  </div>

  <script src="js/classroom.js"></script>
</body>
</html>
